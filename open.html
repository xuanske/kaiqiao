<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开窍 · 三年级数学闯关</title>
<meta name="description" content="小学三年级数学闯关小游戏。答错标考点，错题本重做，不拿孩子跟别人比。">
<style>
  :root { --bg:#eef3ea; --ink:#243026; --mute:#667066; --line:#c9d4c4; --acc:#3d6b45; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 "Songti SC","Noto Serif SC","Source Han Serif SC",serif; }
  main { max-width:640px; margin:0 auto; padding:48px 24px 80px; }
  .mark { width:56px; height:56px; border:1px solid var(--line); display:grid; place-items:center; letter-spacing:.4em; font-size:13px; color:var(--acc); background:#fff; }
  h1 { font-weight:500; font-size:42px; letter-spacing:.35em; margin:28px 0 8px; }
  .sub { color:var(--mute); letter-spacing:.12em; margin-bottom:32px; }
  p { margin:0 0 14px; }
  ul { padding-left:1.2em; }
  li { margin:6px 0; }
  .box { border:1px solid var(--line); padding:18px 20px; margin:28px 0; background:#f7faf5; }
  .warn { font-size:14px; color:var(--mute); }
  footer { margin-top:48px; font-size:13px; color:var(--mute); letter-spacing:.08em; }
</style>
</head>
<body>
<main>
  <div class="mark">窍</div>
  <h1>开窍</h1>
  <p class="sub">小学三年级数学闯关</p>
  <p>竖屏闯关、口算键盘、闪电对决。答错会标出考点（进位、退位、余数、倍差），加减弹出竖式。错题本先重做原题，再出同类新题。</p>
  <div class="box">
    <p>题型按三年级上 / 下册</p>
    <ul>
      <li>口算、万以内加减、认识倍</li>
      <li>多位数乘除、两位数乘两位数</li>
      <li>周长面积、时分秒、分数小数</li>
      <li>位置方向、简单统计</li>
    </ul>
  </div>
  <p class="warn">进度只存在这台设备。没有账号、没有广告，不拿孩子跟别人比。</p>
  <footer>拂尘 · 筹算 · 开窍 · 玄鉴</footer>
</main>
</body>
</html>
