<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1100">
  <rect width="750" height="1100" fill="#eef3ea"/>
  <rect x="40" y="40" width="670" height="1020" fill="none" stroke="#c9d4c4"/>
  <rect x="80" y="88" width="72" height="72" fill="#fff" stroke="#3d6b45"/>
  <text x="116" y="134" text-anchor="middle" font-family="Songti SC, STSong, serif" font-size="22" fill="#3d6b45">窍</text>
  <text x="80" y="230" font-family="Songti SC, STSong, serif" font-size="64" fill="#243026">开窍</text>
  <text x="80" y="278" font-family="Songti SC, STSong, serif" font-size="22" fill="#667066">小学三年级数学闯关</text>
  <text x="80" y="360" font-family="Songti SC, STSong, serif" font-size="26" fill="#243026">竖屏闯关、口算键盘、闪电对决。</text>
  <text x="80" y="402" font-family="Songti SC, STSong, serif" font-size="26" fill="#243026">答错标考点，错题本重做。</text>
  <text x="80" y="500" font-family="Songti SC, STSong, serif" font-size="22" fill="#3d6b45">题型</text>
  <text x="80" y="548" font-family="Songti SC, STSong, serif" font-size="24" fill="#243026">· 口算、万以内加减、认识倍</text>
  <text x="80" y="592" font-family="Songti SC, STSong, serif" font-size="24" fill="#243026">· 多位数乘除、周长面积</text>
  <text x="80" y="636" font-family="Songti SC, STSong, serif" font-size="24" fill="#243026">· 时分秒、分数小数、方向统计</text>
  <text x="80" y="760" font-family="Songti SC, STSong, serif" font-size="22" fill="#667066">没有账号，没有广告。</text>
  <text x="80" y="800" font-family="Songti SC, STSong, serif" font-size="22" fill="#667066">不拿孩子跟别人比。</text>
  <text x="80" y="980" font-family="Songti SC, STSong, serif" font-size="18" fill="#667066">拂尘 · 筹算 · 开窍 · 玄鉴</text>
</svg>
